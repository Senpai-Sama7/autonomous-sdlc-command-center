[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-sdlc-command-center"
version = "1.1.0"
description = "Local-first, safety-gated SDLC control plane: 18 MCP tools, gated writes with rollback, tamper-evident audit log."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
sdlc-mcp = "sdlc_mcp_server:main"
sdlc = "sdlc_cli:main"

[tool.setuptools]
py-modules = ["sdlc_core", "sdlc_analyze", "sdlc_write", "sdlc_cli", "sdlc_mcp_server"]
package-dir = {"" = "mcp"}
