name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Preflight
        run: python mcp/sdlc_cli.py plugin-preflight --plugin-path .

      - name: Smoke tests
        run: python scripts/tests/smoke.py

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Audit Ledger Integrity
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'mcp')
          from pathlib import Path
          from sdlc_write import audit_log
          result = audit_log({'path': '.', 'maxEntries': 1000})
          if not result.get('chainValid', True):
              print(f'CRITICAL: Audit chain verification failed!')
              sys.exit(1)
          print(f'Audit chain valid: {result.get(\"entryCount\", 0)} entries')
          "

      - name: Scan PR Diff for High-Entropy Secrets
        if: github.event_name == 'pull_request'
        run: |
          python3 -c "
          import subprocess, json, sys
          sys.path.insert(0, 'mcp')
          from pathlib import Path
          from sdlc_extensions import entropy_scan

          res = subprocess.run(
              ['git', 'diff', '--name-only', 'origin/${{ github.base_ref }}...HEAD'],
              capture_output=True, text=True, check=True
          )
          modified_files = [f.strip() for f in res.stdout.splitlines() if f.strip()]

          violations = []
          for f in modified_files:
              if Path(f).is_file():
                  result = entropy_scan({'path': '.', 'maxFiles': 1})
                  if result.get('findingCount', 0) > 0:
                      violations.extend(result.get('findings', []))

          if violations:
              print('CRITICAL: High-entropy secret patterns detected in PR:')
              print(json.dumps(violations, indent=2))
              sys.exit(1)
          print('No high-entropy secrets detected in changed files.')
          "

  publish-pypi:
    needs: [smoke, security-gate]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
